services:
  library:
    build: .
    ports:
      - "8080:80"
    environment:
      LIB_LANG: en          # 'en' or 'de'
      # LIB_NAME: My Library  # optional; defaults to "the Library" (en) or "die Bibliothek" (de)
    volumes:
      # Starts with the privacy-safe example catalog. Point BOOKS_JSON at your real catalog when needed.
      - ${BOOKS_JSON:-./books.example.json}:/usr/share/nginx/html/books.json:ro
    restart: unless-stopped
